apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-complex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-complex
  template:
    metadata:
      labels:
        app: grpc-complex
    spec:
      containers:
      - name: grpc-complex
        image: protocols-grpc-complex:local
        ports:
        - containerPort: 50053
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-complex
spec:
  selector:
    app: grpc-complex
  ports:
  - protocol: TCP
    port: 50053
    targetPort: 50053
    name: grpc
