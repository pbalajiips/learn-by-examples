apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-hello
  template:
    metadata:
      labels:
        app: grpc-hello
    spec:
      containers:
      - name: grpc-hello
        image: protocols-grpc-hello:localv2
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-hello
spec:
  selector:
    app: grpc-hello
  ports:
  - protocol: TCP
    port: 50051
    targetPort: 50051
    name: grpc
