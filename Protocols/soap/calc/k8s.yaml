apiVersion: apps/v1
kind: Deployment
metadata:
  name: soap-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soap-calc
  template:
    metadata:
      labels:
        app: soap-calc
    spec:
      containers:
      - name: soap-calc
        image: protocols-soap-calc:local
        ports:
        - containerPort: 5007
---
apiVersion: v1
kind: Service
metadata:
  name: soap-calc
spec:
  selector:
    app: soap-calc
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5007
    name: http
