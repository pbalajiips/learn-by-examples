apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-chat
  template:
    metadata:
      labels:
        app: websocket-chat
    spec:
      containers:
      - name: websocket-chat
        image: protocols-websocket-chat:local
        ports:
        - containerPort: 5004
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-chat
spec:
  selector:
    app: websocket-chat
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5004
    name: http
