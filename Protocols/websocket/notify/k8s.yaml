apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-notify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-notify
  template:
    metadata:
      labels:
        app: websocket-notify
    spec:
      containers:
      - name: websocket-notify
        image: protocols-websocket-notify:local
        ports:
        - containerPort: 5005
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-notify
spec:
  selector:
    app: websocket-notify
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5005
    name: http
